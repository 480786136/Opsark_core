[package]
name = "opsark-core"
version = "2.0.0"
description = "Opsark intelligent operations desktop console"
authors = ["Opsark"]
edition = "2021"

[lib]
name = "opsark_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["time", "sync"] }
keyring = { version = "4.1.5", features = ["v1"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Build OpenSSL for the selected macOS target so Apple Silicon hosts can also
# produce Intel packages without requiring a separate x86_64 Homebrew tree.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ssh2 = "0.9"
